appId: com.desklink.host
productName: DeskLinkHost
copyright: Copyright © DeskLink
electronVersion: 31.7.7

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  # Ícones da janela em runtime (nativeImage); buildResources sozinho não entra no app.asar
  - build/icon.ico
  - build/icon.png

win:
  # Gerado por `npm run build-icon -w agent` a partir de build/icon.png (transparência no PNG)
  icon: build/icon.ico
  target:
    - portable
  artifactName: "${productName}-${version}-portable.${ext}"
  # Evita baixar/extrair winCodeSign (symlinks exigem privilégios em alguns ambientes Windows)
  signAndEditExecutable: false

nsis:
  oneClick: false
